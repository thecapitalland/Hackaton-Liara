      <stop offset="0" stop-color="#07101F"/>
      <stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
