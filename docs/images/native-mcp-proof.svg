      <rect x="0" y="0" width="1152" height="42" rx="18" fill="#0B1425"/>
      <rect x="0" y="24" width="1152" height="18" fill="#0B1425"/>
      <circle cx="24" cy="21" r="6" fill="#F87171"/>
