      <text x="1128" y="26" fill="#475569" font-size="12" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">2026-10-23</text>

      <text x="28" y="78" fill="#7DD3FC" font-size="15">$ opencode mcp list</text>
      <text x="28" y="104" fill="#34D399" font-size="15">✓ agate-liara  connected</text>

